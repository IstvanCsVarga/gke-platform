# Defaults only. Real values come from teams/<team>.yaml. The teams
# ApplicationSet also sets `team` (from the file name), and `pgBucket` and
# `pgBackups` (from the cluster secret: Terraform's on GKE, local/ on kind).
team: ""
pgBucket: ""
pgBackups: "" # "disabled" leaves out the ObjectStore, WAL archiving and ScheduledBackup
owners: []
quota:
  cpu: "2"
  memory: 4Gi
  storage: 10Gi
postgres:
  enabled: false
  instances: 1
  storage: 5Gi
