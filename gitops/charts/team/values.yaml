# Defaults only. Real values come from teams/<team>.yaml. The teams
# ApplicationSet also sets `team` (from the file name) and `pgBucket` (from the
# cluster secret, written by Terraform).
team: ""
pgBucket: ""
owners: []
quota:
  cpu: "2"
  memory: 4Gi
  storage: 10Gi
postgres:
  enabled: false
  instances: 1
  storage: 5Gi
