# The local version of the cluster secret Terraform writes on GKE (the
# argocd_cluster_secret output). There are no buckets here, so it turns team
# backups off explicitly. On GKE nothing sets this, and a missing bucket still
# stops a team's Postgres from rendering.
apiVersion: v1
kind: Secret
metadata:
  name: in-cluster
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    gke-platform/managed: "true"
  annotations:
    gke-platform/pg-backups: disabled
stringData:
  name: in-cluster
  server: https://kubernetes.default.svc
  config: '{"tlsClientConfig":{"insecure":false}}'
